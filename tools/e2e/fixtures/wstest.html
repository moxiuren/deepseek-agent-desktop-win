<!doctype html><meta charset=utf-8><body><script>
window.__log = [];
const w = new WebSocket('wss://chat.deepseek.com/x');
w.binaryType = 'arraybuffer';
w.onopen = () => window.__log.push({ev:'open'});
w.onerror = e => window.__log.push({ev:'error'});
w.onclose = e => window.__log.push({ev:'close', code:e.code, reason:e.reason});
w.onmessage = ev => {
  const d = ev.data;
  window.__log.push({ ev:'msg', typeof_d: typeof d,
    ctor: d && d.constructor && d.constructor.name,
    isAB: d instanceof ArrayBuffer, isBlob: d instanceof Blob,
    byteLength: d && d.byteLength, len: d && d.length,
    str: typeof d === 'string' ? d : null });
};
</script></body>
